<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃什么</title>
<meta name="description" content="选择困难？转盘帮你决定今天吃什么。">
<meta name="theme-color" content="#e9ecff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e1f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
<style>
  :root {
    --bg-1: #e9ecff; --bg-2: #fdeaf5; --text: #1d1b2e; --muted: rgba(29, 27, 46, .58);
    --accent: #5b5bff; --accent-text: #ffffff;
    --glass: rgba(255, 255, 255, .38); --glass-strong: rgba(255, 255, 255, .55);
    --glass-border: rgba(255, 255, 255, .75); --glass-edge: rgba(255, 255, 255, .95);
    --glass-shadow: 0 20px 50px rgba(60, 50, 140, .18), 0 2px 6px rgba(60, 50, 140, .08);
    --hover: rgba(255, 255, 255, .45);
    --blob-1: #ff8fb1; --blob-2: #7aa8ff; --blob-3: #ffd27a; --blob-4: #9d7bff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #0b0e1f; --bg-2: #1a1030; --text: #f2f1ff; --muted: rgba(242, 241, 255, .6);
      --accent: #8a8cff;
      --glass: rgba(255, 255, 255, .08); --glass-strong: rgba(255, 255, 255, .14);
      --glass-border: rgba(255, 255, 255, .18); --glass-edge: rgba(255, 255, 255, .35);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
      --hover: rgba(255, 255, 255, .1);
      --blob-1: #c2185b; --blob-2: #2f5bff; --blob-3: #b8860b; --blob-4: #6a35ff;
    }
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body { margin: 0; min-height: 100vh; color: var(--text); overflow-x: hidden;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2)); background-attachment: fixed;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  /* glowing colour blobs behind the glass */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .aurora i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%;
    filter: blur(70px); opacity: .7; animation: drift 22s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { background: var(--blob-1); top: -12vmax; left: -10vmax; }
  .aurora i:nth-child(2) { background: var(--blob-2); bottom: -16vmax; right: -12vmax; animation-delay: -6s; }
  .aurora i:nth-child(3) { background: var(--blob-3); top: 30%; left: 40%; width: 30vmax; height: 30vmax; opacity: .5; animation-delay: -11s; }
  .aurora i:nth-child(4) { background: var(--blob-4); top: 50%; left: -8vmax; width: 32vmax; height: 32vmax; animation-delay: -3s; }
  @keyframes drift { to { transform: translate(6vmax, -4vmax) scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } }

  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; }
  header { text-align: center; margin-bottom: 22px; }
  h1 { margin: 0; font-size: 2.1rem; letter-spacing: .02em; }
  header p { margin: 6px 0 0; color: var(--muted); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .glass { position: relative; background: var(--glass); border-radius: 28px;
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge), inset 0 -1px 0 rgba(255,255,255,.08); }
  /* specular sheen along the top edge */
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 38%); opacity: .6; }
  .card { padding: 18px; }
  .card > * { position: relative; }

  .wheel-wrap { position: relative; width: 100%; max-width: 460px; margin: 0 auto; aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 30px rgba(40, 30, 120, .25)); }
  .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 38px; z-index: 2;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  .hub { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 23%; aspect-ratio: 1; border-radius: 50%; cursor: pointer;
    color: var(--text); font-size: 1.15rem; font-weight: 700; letter-spacing: .05em;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.85), rgba(255,255,255,.25) 55%, rgba(255,255,255,.12));
    border: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: blur(16px) saturate(200%); backdrop-filter: blur(16px) saturate(200%);
    box-shadow: 0 10px 24px rgba(40, 30, 120, .3), inset 0 2px 1px rgba(255,255,255,.9), inset 0 -4px 10px rgba(80, 60, 200, .18);
    text-shadow: 0 1px 2px rgba(255,255,255,.6); transition: transform .15s ease; }
  .hub:hover { transform: translate(-50%, -50%) scale(1.05); }
  .hub:active { transform: translate(-50%, -50%) scale(.96); }
  .hub:disabled { cursor: wait; opacity: .85; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hub {
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.45), rgba(255,255,255,.1) 55%, rgba(255,255,255,.05)); text-shadow: 0 1px 3px rgba(0,0,0,.6); } }

  .result { text-align: center; min-height: 3.6em; margin-top: 16px; }
  .result .label { color: var(--muted); font-size: .9rem; }
  .result .food { font-size: 2.1rem; font-weight: 800; line-height: 1.3; min-height: 1.3em;
    background: linear-gradient(120deg, #ff5f8f, #8a5bff 50%, #3fa9ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .result .food.pop { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .actions[hidden] { display: flex; visibility: hidden; }  /* keep the row's space so the card doesn't jump */
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  button { font: inherit; }
  .btn { border: 1px solid var(--glass-border); background: var(--glass-strong); color: var(--text);
    border-radius: 999px; padding: 7px 15px; cursor: pointer;
    -webkit-backdrop-filter: blur(12px) saturate(180%); backdrop-filter: blur(12px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--glass-edge), 0 2px 8px rgba(40, 30, 120, .08); transition: background .15s, transform .15s; }
  .btn:hover { background: var(--hover); transform: translateY(-1px); }
  .btn.primary { color: #fff; border-color: rgba(255,255,255,.5);
    background: linear-gradient(135deg, rgba(120, 110, 255, .92), rgba(80, 160, 255, .88));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 6px 16px rgba(90, 90, 255, .35); }
  .btn.primary:hover { filter: brightness(1.06); }

  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .add-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .add-row input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 14px;
    border: 1px solid var(--glass-border); background: var(--glass); color: var(--text); font: inherit;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.06); }
  .add-row input::placeholder { color: var(--muted); }
  .add-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  ul { list-style: none; margin: 0; padding: 0; }
  #menu { max-height: 280px; overflow-y: auto; }
  #menu li { display: flex; align-items: center; justify-content: space-between; padding: 5px 6px; border-radius: 12px; }
  #menu li:hover { background: var(--hover); }
  #menu .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; vertical-align: -1px;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.7); }
  #menu li.off span.name { text-decoration: line-through; color: var(--muted); }
  .icon-btn { border: none; background: none; color: var(--muted); cursor: pointer; padding: 3px 7px; border-radius: 8px; }
  .icon-btn:hover { color: var(--text); background: var(--hover); }
  .hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
  #history { display: flex; flex-wrap: wrap; gap: 6px; }
  #history li { background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 999px;
    padding: 2px 10px; font-size: .85rem; box-shadow: inset 0 1px 0 var(--glass-edge); }
  .side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  footer { text-align: center; margin-top: 28px; font-size: .85rem; }
  footer a { color: var(--text); opacity: .7; text-decoration: none; }
  footer a:hover { opacity: 1; }

  /* focus ring for keyboard users */
  button:focus-visible, .add-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hub:focus-visible { outline-offset: 4px; }

  .pointer { transform-origin: 50% 33%; }
  .sound-toggle { position: absolute; top: 14px; right: 14px; z-index: 3; width: 38px; height: 38px; padding: 0;
    display: grid; place-items: center; font-size: 1.05rem; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .card-head h2 { margin: 0; }
  .meta { color: var(--muted); font-size: .82rem; }
  .link-btn { border: none; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: .82rem; }
  .link-btn:hover { text-decoration: underline; }
  .link-btn[hidden] { display: none; }
  /* fade the bottom of the scrolling menu instead of a hard cut */
  #menu { -webkit-mask-image: linear-gradient(#000 calc(100% - 28px), transparent);
          mask-image: linear-gradient(#000 calc(100% - 28px), transparent); padding-bottom: 20px; }
  #menu.short { -webkit-mask-image: none; mask-image: none; padding-bottom: 0; }
  .add-row.shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  .toast:empty { display: none; }
  .toast { margin: -2px 0 8px; font-size: .82rem; color: var(--muted); transition: opacity .3s; }
  .confetti { position: fixed; pointer-events: none; z-index: 50; font-size: 1.4rem; will-change: transform, opacity; }
  #history li { cursor: default; }
  #history .ago { color: var(--muted); margin-left: 4px; }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main>
  <header>
    <h1>🍜 今天吃什么</h1>
    <p>选择困难？交给转盘吧。</p>
  </header>

  <div class="layout">
    <section class="glass card">
      <button class="btn sound-toggle" id="sound" type="button" aria-pressed="true" title="音效开关">🔊</button>
      <div class="wheel-wrap">
        <svg class="pointer" id="pointer" viewBox="0 0 38 48" aria-hidden="true">
          <defs>
            <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
              <stop offset="1" stop-color="#c9c4ff" stop-opacity=".85"/>
            </linearGradient>
          </defs>
          <path d="M19 47 C12 34 3 26 3 16 A16 16 0 0 1 35 16 C35 26 26 34 19 47 Z" fill="url(#pg)" stroke="rgba(255,255,255,.95)" stroke-width="1.5"/>
          <circle cx="19" cy="16" r="6" fill="#7a6bff" opacity=".85"/>
          <ellipse cx="13" cy="10" rx="5" ry="3" fill="#fff" opacity=".8"/>
        </svg>
        <canvas id="wheel" width="920" height="920" aria-label="菜单转盘"></canvas>
        <button class="hub" id="spin" type="button" title="也可以按空格键">转！</button>
      </div>
      <div class="result" aria-live="polite">
        <div class="label" id="resultLabel">点中间的按钮开始</div>
        <div class="food" id="resultFood"></div>
      </div>
      <div class="actions" id="resultActions" hidden>
        <button class="btn primary" id="accept">就它了 👍</button>
        <button class="btn" id="reject">不想吃，排除再转</button>
      </div>
    </section>

    <aside class="side">
      <section class="glass card">
        <div class="card-head">
          <h2>菜单</h2>
          <span class="meta"><span id="menuCount"></span> <button class="link-btn" id="restoreAll" type="button" hidden>全部恢复</button></span>
        </div>
        <div class="presets" id="presets"></div>
        <form class="add-row" id="addForm">
          <input id="addInput" placeholder="加一道菜，多个用逗号或空格分开" maxlength="60">
          <button class="btn primary" type="submit">添加</button>
        </form>
        <div class="toast" id="toast" aria-live="polite"></div>
        <ul id="menu"></ul>
        <p class="hint">点名字可以暂时排除 / 恢复，菜单会保存在本机浏览器里。</p>
      </section>
      <section class="glass card">
        <div class="card-head">
          <h2>最近吃过</h2>
          <button class="link-btn" id="clearHistory" type="button" hidden>清空记录</button>
        </div>
        <ul id="history"></ul>
        <p class="hint" id="historyEmpty">还没有记录。</p>
      </section>
    </aside>
  </div>
  <footer><a href="../">← 返回首页</a></footer>
</main>

<script>
(() => {
  const PRESETS = {
    '家常': ['红烧肉', '番茄炒蛋', '宫保鸡丁', '鱼香肉丝', '麻婆豆腐', '可乐鸡翅', '糖醋排骨', '青椒肉丝'],
    '外卖': ['黄焖鸡米饭', '麻辣烫', '沙县小吃', '兰州拉面', '烤肉饭', '螺蛳粉', '酸菜鱼', '炸鸡汉堡'],
    '面食': ['牛肉面', '炸酱面', '热干面', '刀削面', '饺子', '馄饨', '凉皮', '重庆小面'],
    '聚餐': ['火锅', '烧烤', '日料', '韩式烤肉', '西餐', '粤式早茶', '小龙虾', '烤鱼'],
    '轻食': ['沙拉', '三明治', '寿司', '饭团', '粥', '关东煮', '轻食碗', '水果'],
  };
  const COLORS = ['#ff6f91', '#ff9a62', '#f7c948', '#6fd08c', '#3cc8c8', '#4fa8ff', '#7b7bff', '#b57bff', '#f27ad6', '#ff7a7a'];
  const KEY = 'what-to-eat:v1';

  const storage = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } },
    save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} },
  };

  const saved = storage.load();
  let state = {
    items: Array.isArray(saved?.items) ? saved.items : PRESETS['外卖'].map(name => ({ name, off: false })),
    history: Array.isArray(saved?.history) ? saved.history : [],
  };

  const $ = id => document.getElementById(id);
  const canvas = $('wheel'), ctx = canvas.getContext('2d');
  let rotation = 0, spinning = false, current = null, winner = null, glow = 0;
  let soundOn = saved?.soundOn !== false;
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- sound & haptics (Web Audio, created lazily on the first user gesture)
  let audio = null;
  function ac() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; } }
    if (audio?.state === 'suspended') audio.resume();
    return audio;
  }
  function tone(freq, start, len, vol, type = 'triangle') {
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + start;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + len + 0.02);
  }
  function tick() {
    if (soundOn) { tone(1500 + Math.random() * 200, 0, 0.05, 0.06); navigator.vibrate?.(4); }
    if (!reduceMotion()) $('pointer').animate(
      [{ transform: 'translateX(-50%) rotate(-24deg)' }, { transform: 'translateX(-50%) rotate(0deg)' }],
      { duration: 140, easing: 'cubic-bezier(.3,1.6,.5,1)' });
  }
  function chime() {
    if (!soundOn) return;
    [[784, 0], [988, 0.09], [1319, 0.18]].forEach(([f, d]) => tone(f, d, 0.5, 0.08, 'sine'));
    navigator.vibrate?.([12, 40, 18]);
  }

  const active = () => state.items.filter(i => !i.off);
  const persist = () => storage.save({ ...state, soundOn });

  function rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  }

  function draw() {
    const list = active();
    const W = canvas.width, c = W / 2, r = c - 22;
    ctx.clearRect(0, 0, W, W);
    ctx.save();
    ctx.translate(c, c);

    // frosted base disc so the segments read as tinted glass
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill();

    if (!list.length) {
      ctx.fillStyle = 'rgba(120,120,160,.7)'; ctx.font = '600 40px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('先加几道菜吧', 0, -r * 0.45);
    } else {
      const seg = Math.PI * 2 / list.length;
      ctx.save();
      ctx.rotate(rotation);
      list.forEach((item, i) => {
        const a0 = -Math.PI / 2 + i * seg, col = colorOf(item);
        const g = ctx.createRadialGradient(0, 0, r * 0.12, 0, 0, r);
        g.addColorStop(0, rgba(col, .35));
        g.addColorStop(0.65, rgba(col, .72));
        g.addColorStop(1, rgba(col, .9));
        const isWin = winner === item.name, dim = winner && !isWin;
        ctx.globalAlpha = dim ? 1 - 0.4 * glow : 1;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0, a0 + seg); ctx.closePath();
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3; ctx.stroke();
        if (isWin && glow > 0) {
          ctx.save();
          ctx.fillStyle = `rgba(255,255,255,${0.22 * glow})`; ctx.fill();
          ctx.shadowColor = rgba(col, 1); ctx.shadowBlur = 40 * glow;
          ctx.strokeStyle = `rgba(255,255,255,${0.95 * glow})`; ctx.lineWidth = 6; ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.rotate(a0 + seg / 2);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        const size = Math.max(22, Math.min(44, 520 / list.length + 14));
        ctx.font = `700 ${size}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
        ctx.shadowColor = 'rgba(30, 20, 80, .45)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
        let text = item.name;
        while (ctx.measureText(text).width > r * 0.6 && text.length > 1) text = text.slice(0, -1);
        if (text !== item.name) text += '…';
        // keep labels upright: flip the ones that would sit on the left half of the wheel
        if (Math.cos(a0 + seg / 2 + rotation) < 0) {
          ctx.rotate(Math.PI); ctx.textAlign = 'left'; ctx.fillText(text, -(r - 30), 0);
        } else {
          ctx.fillText(text, r - 30, 0);
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      });
      ctx.restore();
    }

    // static glass effects (do not rotate): top-left specular highlight + bottom inner glow
    const hl = ctx.createLinearGradient(-r, -r, r * 0.4, r * 0.4);
    hl.addColorStop(0, 'rgba(255,255,255,.55)');
    hl.addColorStop(0.45, 'rgba(255,255,255,.08)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = hl; ctx.fill();

    const inner = ctx.createRadialGradient(0, 0, r * 0.75, 0, 0, r);
    inner.addColorStop(0, 'rgba(255,255,255,0)');
    inner.addColorStop(1, 'rgba(255,255,255,.35)');
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = inner; ctx.fill();

    // thick glass rim
    const rim = ctx.createLinearGradient(-r, -r, r, r);
    rim.addColorStop(0, 'rgba(255,255,255,.95)');
    rim.addColorStop(0.5, 'rgba(255,255,255,.35)');
    rim.addColorStop(1, 'rgba(255,255,255,.8)');
    ctx.beginPath(); ctx.arc(0, 0, r + 8, 0, Math.PI * 2);
    ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r + 8, 0, Math.PI * 2);
    ctx.lineWidth = 2.5; ctx.strokeStyle = rim; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();

    ctx.restore();
  }

  function colorOf(item) { return COLORS[state.items.indexOf(item) % COLORS.length]; }

  function spin() {
    const list = active();
    if (spinning) return;
    if (list.length < 2) { showResult(list[0]?.name ?? null, list.length ? '只剩一个了：' : '菜单是空的'); return; }
    spinning = true; winner = null; glow = 0;
    ac();
    $('spin').disabled = true;
    $('resultActions').hidden = true;
    $('resultLabel').textContent = '转呀转……';
    $('resultFood').textContent = '';

    const seg = Math.PI * 2 / list.length;
    const pick = Math.floor(Math.random() * list.length);
    const jitter = (Math.random() - 0.5) * seg * 0.7;
    // pointer is at top (-90°). Segment i centre sits at -90° + (i+0.5)·seg + rotation, so we need rotation ≡ -(i+0.5)·seg
    const target = -(pick + 0.5) * seg + jitter;
    const base = rotation % (Math.PI * 2);
    let delta = ((target - base) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    delta += Math.PI * 2 * (5 + Math.floor(Math.random() * 3));
    const start = rotation, dur = 4200 + Math.random() * 800, t0 = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 4);

    const reduce = reduceMotion();
    const under = rot => Math.floor((((-rot) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / seg);
    let last = under(rotation);
    function frame(now) {
      const t = reduce ? 1 : Math.min(1, (now - t0) / dur);
      rotation = start + delta * ease(t);
      const u = under(rotation);
      if (u !== last && !reduce) { last = u; tick(); }
      draw();
      if (t < 1) requestAnimationFrame(frame);
      else {
        spinning = false; $('spin').disabled = false;
        winner = list[pick].name;
        showResult(winner, '今天就吃：');
        chime(); fadeGlow();
      }
    }
    requestAnimationFrame(frame);
  }

  function fadeGlow() {
    if (reduceMotion()) { glow = 1; draw(); return; }
    const t0 = performance.now();
    (function step(now) {
      if (!winner) return;
      glow = Math.min(1, (now - t0) / 350); draw();
      if (glow < 1) requestAnimationFrame(step);
    })(t0);
  }
  function clearWinner() { winner = null; glow = 0; }

  function showResult(name, label) {
    canvas.setAttribute('aria-label', name ? `菜单转盘，结果：${name}` : '菜单转盘');
    current = name;
    $('resultLabel').textContent = label;
    const f = $('resultFood');
    f.textContent = name ?? '';
    f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop');
    $('resultActions').hidden = !name;
  }

  function renderMenu() {
    const ul = $('menu');
    ul.innerHTML = '';
    const offCount = state.items.filter(i => i.off).length;
    $('menuCount').textContent = state.items.length ? `${state.items.length} 道` + (offCount ? ` · 排除 ${offCount}` : '') : '';
    $('restoreAll').hidden = !offCount;
    ul.classList.toggle('short', state.items.length <= 7);
    state.items.forEach((item, idx) => {
      const li = document.createElement('li');
      if (item.off) li.className = 'off';
      const left = document.createElement('button');
      left.className = 'icon-btn'; left.style.color = 'inherit'; left.style.textAlign = 'left'; left.style.flex = '1';
      left.title = item.off ? '恢复' : '暂时排除';
      left.innerHTML = `<span class="dot" style="background:${item.off ? 'transparent' : COLORS[idx % COLORS.length]};border:1px solid ${COLORS[idx % COLORS.length]}"></span>`;
      const span = document.createElement('span'); span.className = 'name'; span.textContent = item.name;
      left.appendChild(span);
      left.onclick = () => { if (spinning) return; item.off = !item.off; clearWinner(); update(); };
      const del = document.createElement('button');
      del.className = 'icon-btn'; del.textContent = '✕'; del.title = '删除'; del.setAttribute('aria-label', `删除${item.name}`);
      del.onclick = () => { if (spinning) return; state.items.splice(idx, 1); clearWinner(); update(); };
      li.append(left, del);
      ul.appendChild(li);
    });
  }

  function renderHistory() {
    const ul = $('history');
    ul.innerHTML = '';
    state.history.slice(0, 10).forEach(h => {
      const li = document.createElement('li');
      const d = new Date(h.at);
      li.textContent = h.name;
      li.title = d.toLocaleString('zh-CN');
      const ago = document.createElement('span'); ago.className = 'ago'; ago.textContent = daysAgo(d);
      li.appendChild(ago);
      ul.appendChild(li);
    });
    $('historyEmpty').hidden = state.history.length > 0;
    $('clearHistory').hidden = !state.history.length;
  }
  function daysAgo(d) {
    const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
    const n = Math.round((day(new Date()) - day(d)) / 864e5);
    return n === 0 ? '今天' : n === 1 ? '昨天' : n < 7 ? `${n} 天前` : `${d.getMonth() + 1}/${d.getDate()}`;
  }
  let toastTimer;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.style.opacity = 1;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.opacity = 0; toastTimer = setTimeout(() => { el.textContent = ''; }, 300); }, 2600);
  }
  function confetti() {
    if (reduceMotion()) return;
    const box = $('resultFood').getBoundingClientRect();
    const cx = box.left + box.width / 2, cy = box.top + box.height / 2;
    const emojis = ['🎉', '✨', '🍜', '🍣', '🥟', '🍗', '🌶️', '🍤'];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('span');
      el.className = 'confetti'; el.textContent = emojis[i % emojis.length];
      el.style.left = cx + 'px'; el.style.top = cy + 'px';
      document.body.appendChild(el);
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3, dist = 90 + Math.random() * 120;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      el.animate([
        { transform: 'translate(-50%, -50%) scale(.4)', opacity: 1, easing: 'cubic-bezier(.15,.8,.3,1)' },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${(Math.random() - .5) * 120}deg)`, opacity: 1, offset: .6, easing: 'ease-in' },
        { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 80}px)) scale(.9)`, opacity: 0 },
      ], { duration: 1100 + Math.random() * 400 }).onfinish = () => el.remove();
    }
  }

  function update() { persist(); renderMenu(); draw(); }

  // presets
  const presetBox = $('presets');
  Object.keys(PRESETS).forEach(k => {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = k; b.title = `把菜单换成「${k}」`;
    b.onclick = () => { if (spinning) return; state.items = PRESETS[k].map(name => ({ name, off: false })); clearWinner(); update(); toast(`已换成「${k}」菜单`); };
    presetBox.appendChild(b);
  });
  const clear = document.createElement('button');
  clear.className = 'btn'; clear.textContent = '清空';
  clear.onclick = () => {
    if (spinning || !state.items.length) return;
    const backup = state.items; state.items = []; clearWinner(); update();
    toast('菜单已清空');
    const el = $('toast'); const undo = document.createElement('button');
    undo.className = 'link-btn'; undo.textContent = ' 撤销'; undo.type = 'button';
    undo.onclick = () => { state.items = backup; update(); toast('已恢复'); };
    el.appendChild(undo);
  };
  presetBox.appendChild(clear);

  $('addForm').onsubmit = e => {
    e.preventDefault();
    if (spinning) return;
    const names = [...new Set($('addInput').value.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean))];
    const form = $('addForm');
    if (!names.length) { form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); $('addInput').focus(); return; }
    const existing = new Set(state.items.map(i => i.name));
    const added = [], dup = [];
    names.forEach(n => {
      if (existing.has(n)) {
        dup.push(n);
        const it = state.items.find(i => i.name === n); if (it.off) it.off = false;  // re-adding an excluded dish brings it back
      } else { state.items.push({ name: n, off: false }); existing.add(n); added.push(n); }
    });
    $('addInput').value = '';
    clearWinner(); update();
    toast(added.length ? `已添加 ${added.join('、')}` + (dup.length ? `（${dup.join('、')} 已经有了）` : '') : `${dup.join('、')} 已经在菜单里了`);
  };

  $('spin').onclick = spin;
  $('accept').onclick = () => {
    if (!current) return;
    state.history.unshift({ name: current, at: Date.now() });
    state.history = state.history.slice(0, 30);
    persist(); renderHistory();
    $('resultLabel').textContent = '好嘞，祝你吃得开心 😋';
    $('resultActions').hidden = true;
    confetti();
  };
  $('reject').onclick = () => {
    const item = state.items.find(i => i.name === current && !i.off);
    if (item) { item.off = true; clearWinner(); update(); }
    spin();
  };
  $('restoreAll').onclick = () => { if (spinning) return; state.items.forEach(i => { i.off = false; }); clearWinner(); update(); };
  $('clearHistory').onclick = () => { state.history = []; persist(); renderHistory(); };
  const soundBtn = $('sound');
  const syncSound = () => { soundBtn.textContent = soundOn ? '🔊' : '🔇'; soundBtn.setAttribute('aria-pressed', soundOn); soundBtn.title = soundOn ? '关闭音效' : '开启音效'; };
  soundBtn.onclick = () => { soundOn = !soundOn; syncSound(); persist(); if (soundOn) tone(1200, 0, 0.06, 0.06); };
  syncSound();
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); spin(); }
  });

  renderMenu(); renderHistory(); draw();
})();
</script>
</body>
</html>
